<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact AMT - Digital Literacy Drive</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0a1d3f; /* night blue */
      color: #f5e1a4; /* gold */
      line-height: 1.6;
    }

    header {
      background-color: #001f5b;
      color: #f5e1a4;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #11264d;
      border-radius: 10px;
    }

    h2 {
      color: #f5e1a4;
      text-align: center;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      text-align: center;
    }

    a.email-link {
      color: #f5e1a4;
      background-color: #001f5b;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-top: 15px;
      transition: 0.3s;
    }

    a.email-link:hover {
      background-color: #223b7b;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #001f5b;
      color: #f5e1a4;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Contact AMT</h1>
    <p>Digital Literacy Drive</p>
  </header>

  <main>
    <h2>Get in Touch</h2>
    <p>If you have questions or want to learn more about our digital literacy programs, reach out via email:</p>
    <p><a href="mailto:AMTlearnmore@gmail.com" class="email-link">AMTlearnmore@gmail.com</a></p>
  </main>

  <footer>
    <p>&copy; 2025 Aquilonia Ministry of Technology</p>
  </footer>

</body>
</html>
